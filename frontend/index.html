<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STACY - Historial de Comandos</title>
  <script>
    (function () {
      var saved = localStorage.getItem("stacy_theme");
      var prefers = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", saved || prefers);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:," />
</head>
<body>

  <!-- ═══ NAVBAR ═══ -->
  <nav class="navbar" id="navbar">
    <div class="navbar-brand">
      <span class="navbar-logo">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        STACY
      </span>
    </div>
    <div class="navbar-user" id="navbar-user">
      <button id="theme-toggle" type="button" class="btn-navbar btn-icon-navbar" title="Cambiar tema"></button>
      <button id="machine-select-btn" type="button" class="btn-navbar">Bajar comandos de este equipo</button>
      <div class="user-trigger" id="user-trigger">
        <span class="user-label" id="user-label"></span>
        <span class="user-avatar" id="user-avatar">?</span>
      </div>
    </div>

    <!-- ═══ PROFILE PANEL ═══ -->
    <div class="profile-overlay" id="profile-overlay" style="display:none"></div>
    <div class="profile-panel" id="profile-panel">
      <div class="profile-header">
        <div class="profile-avatar-lg" id="profile-avatar">?</div>
        <div class="profile-info">
          <span class="profile-username" id="profile-username">---</span>
          <span class="profile-label">Perfil de usuario</span>
        </div>
      </div>
      <div class="profile-body">
        <hr class="profile-divider" />
        <button class="profile-logout" id="profile-logout">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Cerrar sesion
        </button>
      </div>
    </div>
  </nav>

  <main class="layout">

    <!-- ═══ AUTH: LOGIN / REGISTER ═══ -->
    <div class="auth-wrapper" id="auth-wrapper">
      <div class="auth-bg-decoration"></div>
      <section class="auth-card">
        <div class="auth-card-header">
          <div class="auth-logo">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          </div>
          <h1>STACY</h1>
          <p class="auth-tagline">Historial de Comandos</p>
        </div>

        <div class="auth-body">
          <div class="auth-tabs">
            <button id="auth-tab-login" class="auth-tab active" type="button">Iniciar sesion</button>
            <button id="auth-tab-register" class="auth-tab" type="button">Registrarse</button>
          </div>

          <form id="login-form" class="auth-form">
            <div class="input-group">
              <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input type="text" id="login-username" placeholder="Usuario" required />
            </div>
            <div class="input-group">
              <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" id="login-password" placeholder="Contrasena" required />
            </div>
            <button type="submit">Ingresar</button>
          </form>

          <form id="register-form" class="auth-form" style="display:none">
            <div class="input-group">
              <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input type="text" id="reg-username" placeholder="Usuario" required />
            </div>
            <div class="input-group">
              <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              <input type="text" id="reg-apellidos" placeholder="Apellidos" required />
            </div>
            <div class="input-group">
              <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              <input type="email" id="reg-correo" placeholder="Correo" required />
            </div>
            <div class="input-group">
              <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" id="reg-password" placeholder="Contrasena" required />
            </div>
            <button type="submit">Registrarse</button>
          </form>

          <div class="auth-divider">
            <span>o continua con</span>
          </div>

          <button id="google-login-btn" class="btn-google" type="button">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            <span>Continuar con Google</span>
          </button>

          <div id="auth-message" class="auth-message"></div>
        </div>
      </section>
    </div>

    <!-- ═══ DASHBOARD ═══ -->
    <div class="dashboard" id="dashboard">
      <div class="dashboard-content">

        <aside class="sidebar" id="sidebar">
          <div class="sidebar-header">
            <h3>Carpetas</h3>
            <button id="add-folder-btn" class="btn-icon" title="Nueva carpeta" type="button">+</button>
          </div>

          <ul class="folder-list" id="folder-list">
            <li class="folder-item active" data-folder-id="all">
              <div class="folder-info">
                <span class="folder-name">Todos los comandos</span>
              </div>
              <span class="folder-count" id="count-all">0</span>
            </li>
          </ul>

        </aside>

         <div class="main-content">
          <div class="toolbar">
            <div class="search-bar">
              <input type="text" id="search-input" placeholder="Filtrar comandos..." />
            </div>
            <div class="toolbar-actions">
              <div class="machine-toggle" id="machine-filter" style="display:none"></div>
              <div class="view-toggle toolbar-toggle">
                <button id="view-recent" class="view-btn" type="button">Ultimos 11</button>
                <button id="view-all" class="view-btn active" type="button">Todos</button>
              </div>
              <button id="refresh-btn" class="btn-toolbar" type="button">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                Actualizar
              </button>
            </div>
          </div>

          <section class="panel">
            <div class="panel-header">
              <h2 id="panel-title">Todos los comandos</h2>
              <span id="folder-badge" class="folder-badge" style="display:none"></span>
            </div>

            <p id="status-message" class="status-message">Cargando comandos...</p>
            <ul id="command-list" class="command-list"></ul>
          </section>
        </div>

      </div>
    </div>

  </main>

  <!-- ═══ MODAL ═══ -->
  <div class="modal-overlay" id="modal-overlay" style="display:none">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title"></h3>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer">
        <button class="btn-sm btn-outline" id="modal-cancel">Cancelar</button>
        <button class="btn-sm" id="modal-save">Guardar</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js?v=5"></script>

</body>
</html>
