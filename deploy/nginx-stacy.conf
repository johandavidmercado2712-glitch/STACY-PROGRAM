# STACY - configuracion Nginx (destino: /etc/nginx/sites-enabled/stacy en EC2)
# Seguridad (Frente B): server_tokens off + HSTS / X-Frame-Options /
# X-Content-Type-Options / Content-Security-Policy.
# Desplegar en EC2 con:
#   sudo cp deploy/nginx-stacy.conf /etc/nginx/sites-enabled/stacy
#   sudo nginx -t && sudo systemctl reload nginx

server {
    server_name stacyprogram.online www.stacyprogram.online;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location /frontend/ {
        proxy_pass http://127.0.0.1:5500/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(auth|users|historial|comandos|carpetas|notas|token|register)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /var/www/stacy-landing;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/stacyprogram.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stacyprogram.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- Cabeceras de seguridad (Frente B) ---
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self';" always;
}

server {
    if ($host = www.stacyprogram.online) {
        return 301 https://$host$request_uri;
    }
    if ($host = stacyprogram.online) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name stacyprogram.online www.stacyprogram.online;
    return 404;
}
